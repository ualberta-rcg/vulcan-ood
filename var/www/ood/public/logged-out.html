<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Terminal logout hop. mod_auth_openidc already destroyed the local OIDC
       session cookie via /oidc?logout=...this page; now bounce the browser
       straight to the Alliance IdP to end the SSO session. Static file only —
       no Apache/OIDC config change, so the TLS-hardened vhost is untouched. -->
  <meta http-equiv="refresh" content="0; url=https://idp.alliancecan.ca/idp/profile/Logout">
  <title>Signing out — Vulcan OnDemand</title>
  <script>window.location.replace("https://idp.alliancecan.ca/idp/profile/Logout");</script>
</head>
<body>
  <p>Signing you out&hellip; If you are not redirected automatically,
     <a href="https://idp.alliancecan.ca/idp/profile/Logout">continue to the Alliance sign-out page</a>.</p>
</body>
</html>
