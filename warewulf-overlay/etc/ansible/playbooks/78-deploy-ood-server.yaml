---
################################################################################
# Open OnDemand Bootstrap Playbook
################################################################################
# Purpose: Deploy and configure Open OnDemand web portal for HPC cluster access
# Target: ood-login overlay nodes
# Execution: Run via Warewulf overlay system during node provisioning
################################################################################

- name: Bootstrap Open OnDemand (overlay-based)
  hosts: localhost
  become: true

  vars:
    # Temporary workspace for downloads and git operations
    workdir: /tmp/ondemand-bootstrap

    # Source repository containing custom OOD configurations
    repo_url: https://github.com/ualberta-rcg/vulcan-ood.git
    repo_dir: /tmp/ondemand-bootstrap/ood

    # Staging directory paths for configuration overrides
    src_path: "/etc/ood/staging/"
    dest_path: "/etc/ood/"

    # Default OOD applications to remove (conflicts with custom apps)
    ood_sys_app_dir: /var/www/ood/apps/sys
    ood_sys_dirs_to_remove:
      - bc_desktop  # Remove default desktop app (using custom version)

  tasks:

    ############################################################################
    # PHASE 0: Environment Preparation
    ############################################################################
    # Create working directory structure before any operations

    - name: Ensure temporary working directory exists
      file:
        path: "{{ workdir }}"
        state: directory
        mode: '0755'

    ############################################################################
    # PHASE 1: System Dependencies
    ############################################################################
    # Install required packages for OOD, Apache, authentication, and VirtualGL

    - name: Install base packages
      apt:
        name:
          # Network utilities
          - curl
          - wget
          - git
          - ca-certificates
          - apt-transport-https
          - sssd-tools

          # Web server and authentication
          - apache2
          - libapache2-mod-auth-openidc      # OpenID Connect authentication
          - libapache2-mod-authnz-pam        # PAM authentication support

          # Python dependencies for OOD features
          - python3-requests
          - python3-requests-oauthlib

          # VirtualGL for remote desktop acceleration
          - virtualgl
        state: present
        update_cache: true

    ############################################################################
    # PHASE 2: Open OnDemand Installation
    ############################################################################
    # Install OOD from official Ohio Supercomputer Center repository

    - name: Download OOD repo package
      get_url:
        url: https://apt.osc.edu/ondemand/4.1/ondemand-release-web_4.1.0-noble_all.deb
        dest: "{{ workdir }}/ondemand-release-web.deb"
        mode: '0644'

    - name: Install OOD repository configuration
      apt:
        deb: "{{ workdir }}/ondemand-release-web.deb"

    - name: Install Open OnDemand package
      apt:
        name: ondemand
        state: present
        update_cache: true

    ############################################################################
    # PHASE 3: Custom Configuration Repository
    ############################################################################
    # Clone site-specific OOD configurations and applications

    - name: Clone ood repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_dir }}"
        update: yes

    ############################################################################
    # PHASE 4: Pre-deployment Permissions
    ############################################################################
    # Fix executable permissions on scripts BEFORE copying to production paths
    # This prevents permission-related runtime errors

    - name: Make shell scripts executable
      command: >
        find {{ repo_dir }} -name "*.sh" -type f -exec chmod +x {} \;

    - name: Make ERB template scripts executable
      command: >
        find {{ repo_dir }} -name "*.sh.erb" -type f -exec chmod +x {} \;

    ############################################################################
    # PHASE 5: Remove Conflicting Defaults
    ############################################################################
    # Clean up default OOD applications that conflict with custom implementations

    - name: Remove known conflicting OOD sys apps
      file:
        path: "{{ ood_sys_app_dir }}/{{ item }}"
        state: absent
      loop: "{{ ood_sys_dirs_to_remove }}"

    ############################################################################
    # PHASE 6: Deploy Custom Configurations
    ############################################################################
    # Copy custom OOD configurations, web apps, and operational scripts
    # Organized by functional directory structure

    - name: Deploy OOD configuration files
      copy:
        src: "{{ repo_dir }}/etc/ood/"
        dest: /etc/ood/
        remote_src: true

    - name: Deploy OOD web applications
      copy:
        src: "{{ repo_dir }}/var/www/ood/"
        dest: /var/www/ood/
        remote_src: true

    - name: Deploy OOD operational scripts
      copy:
        src: "{{ repo_dir }}/opt/ood/"
        dest: /opt/ood/
        remote_src: true

    # NOTE: the config generators (gen_*_rb.sh) are shell scripts and must NOT
    # live in /etc/cron.d (cron parses them as crontabs -> "bad minute" spam and
    # they never run). They are deployed to /opt/ood/cron/ by the opt/ood copy
    # above and run there. Their schedule is the crontab below (login node only,
    # since /opt/ood/cron lives here), and they are also run once in PHASE 7.

    - name: Install cron schedule for the OOD config generators
      copy:
        src: "{{ repo_dir }}/etc/cron.d/ood-generators"
        dest: /etc/cron.d/ood-generators
        remote_src: true
        mode: '0644'

    # Synchronize staging configs to production (overwrites existing files)
    - name: Apply staging configuration overrides
      ansible.posix.synchronize:
        src: "{{ src_path }}"
        dest: "{{ dest_path }}"
        recursive: yes
        archive: yes
        checksum: yes  # Force overwrite even if file sizes match

    # ── Re-apply repo-owned dashboard config AFTER staging sync ─────────────
    # Staging legitimately holds SECRETS / site-specific files
    # (ood_portal.yml, clusters.d/vulcan.yml, nginx_stage.yml) which MUST win.
    # But it ALSO ships stale copies of non-secret files this repo owns
    # (ondemand.yml dashboard layout, motd) — staging's copies silently clobber
    # our work on every boot, reverting the front page. Re-apply the repo
    # versions LAST so the repo stays authoritative for the files it manages.
    - name: Re-apply repo-owned dashboard config (staging ships stale copies)
      copy:
        src: "{{ repo_dir }}/etc/ood/config/ondemand.d/{{ item }}"
        dest: "/etc/ood/config/ondemand.d/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      loop:
        - ondemand.yml
        - motd

    ############################################################################
    # PHASE 7: Dynamic Configuration Generation
    ############################################################################
    # Run configuration generators to create cluster-specific configs
    # Must run BEFORE applying bug fixes that depend on generated files

    - name: Generate cluster configuration from Slurm
      command: /opt/ood/cron/gen_cluster_rb.sh

    - name: Generate GPU resource configuration
      command: /opt/ood/cron/gen_gpu_rb.sh

    - name: Generate application-specific configurations
      command: /opt/ood/cron/gen_app_rb.sh


    ############################################################################
    # PHASE 9: Known Issue Patches
    ############################################################################
    # Apply fixes for common OOD bugs and misconfigurations

    - name: Fix xterm color issue (enable 256 color support)
      replace:
        path: /var/www/ood/apps/sys/shell/app.js
        regexp: xterm-16color
        replace: xterm-256color

    - name: Fix noVNC compression minimum (prevent compression=0 errors)
      replace:
        path: /var/www/ood/apps/sys/dashboard/app/views/batch_connect/sessions/connections/_novnc.html.erb
        regexp: 'min:\s*0'
        replace: 'min: 1'

    # paice_gpu_info.rb is generated by gen_gpu_rb.sh with comma-safe Gres= parsing (no shard corruption).

    ############################################################################
    # PHASE 10: SSL/TLS Configuration
    ############################################################################
    # Prepare SSL directory (certificate installation handled separately)

    - name: Ensure SSL directory exists
      file:
        path: /etc/ssl/ood
        state: directory
        mode: '0755'

    # Generate 2048-bit DH params for TLS.
    # MUST run before the portal regen/restart so the SSLOpenSSLConfCmd DHParameters
    # directive in ood_portal.yml resolves at apache startup.
    # Validate any existing pem FIRST (parses + is 2048-bit): a weak (<2048), malformed,
    # or placeholder DH param (e.g. a hand-pasted ffdhe2048 that crashes mod_ssl) is
    # replaced rather than kept. On a stateless node /etc is tmpfs so the file is gone
    # each boot and this generates fresh; on a persistent node a valid 2048-bit pem is reused.
    - name: Check existing DH params are valid and 2048-bit
      command: openssl dhparam -in /etc/ssl/ood/dhparam.pem -text -noout
      register: dhparam_check
      changed_when: false
      failed_when: false

    - name: Generate strong 2048-bit DH params (only if missing/weak/malformed)
      command: openssl dhparam -out /etc/ssl/ood/dhparam.pem 2048
      when: dhparam_check.rc != 0 or '2048 bit' not in (dhparam_check.stdout | default(''))

    ############################################################################
    # PHASE 11: Critical Permissions and Ownership
    ############################################################################
    # Fix ownership and permissions to ensure proper OOD functionality
    # Order matters: fix service accounts first, then user access

    # Fix ondemand-nginx service account ownership
    - name: Ensure ondemand-nginx owns runtime directories
      file:
        path: "{{ item }}"
        owner: ondemand-nginx
        group: ondemand-nginx
        recurse: true
        state: directory
      loop:
        - /var/lib/ondemand-nginx

    # Enable user access to OOD configuration files
    - name: Set proper permissions on /etc/ood directory
      file:
        path: /etc/ood
        mode: '0755'
        state: directory

    - name: Set proper permissions on dashboard config directory
      file:
        path: /etc/ood/config/apps/dashboard
        mode: '0755'
        state: directory

    # Add Apache service account to OOD group for proper integration
    - name: Add www-data user to ondemand-nginx group
      user:
        name: www-data
        groups: ondemand-nginx
        append: yes

    # Secure system applications (prevent user modification)
    - name: Ensure OOD system apps are root-owned
      file:
        path: /var/www/ood/apps/sys
        owner: root
        group: root
        recurse: true
        mode: '0755'

    ############################################################################
    # PHASE 13: Module Discovery for OOD Dashboard
    ############################################################################
    # Generate Lmod spider JSON so OOD can display available software modules

    - name: Ensure OOD modules directory exists
      file:
        path: /ood/modules
        state: directory
        mode: '0755'

    - name: Generate Lmod spider JSON for OOD module list
      shell: >
        /cvmfs/soft.computecanada.ca/custom/software/lmod/lmod/libexec/spider
        -o spider-json
        /cvmfs/soft.computecanada.ca/easybuild/modules/2023/x86-64-v3/Core:/cvmfs/soft.computecanada.ca/custom/modules
        > /ood/modules/vulcan.json
      args:
        creates: /ood/modules/vulcan.json

    - name: Set permissions on module JSON
      file:
        path: /ood/modules/vulcan.json
        mode: '0644'

    ############################################################################
    # PHASE 12: OOD Regeneration and Cleanup
    ############################################################################
    # Clean stale nginx configurations and regenerate portal config

    # ── Passenger vs per-user /tmp: keep the PUN off /tmp ENTIRELY ──────────
    # pam_namespace.so (common-session, opts unmnt_remnt) gives every PAM
    # session a fresh mount namespace and UNMOUNTS /tmp there; for users in
    # the namespace.d exclusion list (root!) it never remounts anything. So
    # apache's `sudo nginx_stage pun` -- a root PAM session -- leaves the PUN
    # with the NAKED image /tmp (root:root 0775, no sticky bit), unwritable
    # by the PUN user. Three distinct Passenger /tmp consumers break:
    #   1. instance registry (watchdog dies -> nginx serves static -> 403)
    #   2. spawn work dir /tmp/passenger.spawn.* (app spawn fails ->
    #      "Web application could not be started"; passenger_temp_path does
    #      NOT control this -- only passenger_spawn_dir / $TMPDIR does)
    #   3. the apps' own tempfiles (Ruby Tempfile, upload buffers, ...)
    # Registry + spawn dir go to /run tmpfs: never polyinstantiated (works
    # from ANY launch context), emptied every boot (stale dirs impossible,
    # no wipe task needed), never aged by systemd-tmpfiles (age '-').
    # App TMPDIR goes to /var/tmp: local disk (large uploads must not land
    # in RAM tmpfs), already 1777, and its 14d tmpfiles aging self-cleans
    # abandoned app scratch. No dpkg-owned template is patched: pun.conf.erb
    # renders the passenger_options hash from nginx_stage.yml natively.
    # Dead ends (do not retry): <%= tmp_root %> is root:root 0755 -> watchdog
    # EACCES; a not-yet-existing subdir -> ENOENT (Passenger has no mkdir -p);
    # /var/tmp for the REGISTRY persists warm reboots and gets aged -> stale
    # instance dirs.

    - name: Create boot-cleared tmpfs dirs for Passenger registry and spawn
      copy:
        dest: /etc/tmpfiles.d/ondemand-passenger.conf
        content: |
          # Passenger instance registry + spawn work dir for OOD PUNs
          # (see playbook 78). Age '-' = never cleaned by systemd-tmpfiles;
          # /run empties at every boot.
          d /run/ondemand-passenger 1777 root root -
          d /run/ondemand-passenger-spawn 1777 root root -
        owner: root
        group: root
        mode: '0644'

    - name: Apply tmpfiles config now (dirs must exist before any PUN spawns)
      command: systemd-tmpfiles --create /etc/tmpfiles.d/ondemand-passenger.conf

    - name: Point Passenger registry, spawn dir and app TMPDIR off /tmp (nginx_stage.yml)
      # Runs after the staging sync (PHASE 6), which ships nginx_stage.yml and
      # must win for its own keys -- this only appends the passenger_options
      # block, and is idempotent via the blockinfile markers.
      blockinfile:
        path: /etc/ood/config/nginx_stage.yml
        marker: "# {mark} ANSIBLE MANAGED: passenger instance registry (playbook 78)"
        block: |
          passenger_options:
            passenger_instance_registry_dir: "/run/ondemand-passenger"
            passenger_spawn_dir: "/run/ondemand-passenger-spawn"
            passenger_env_var: "TMPDIR /var/tmp"

    - name: Clean OOD nginx stage (remove stale per-user instances)
      command: >
        /opt/ood/nginx_stage/sbin/nginx_stage nginx_clean --force

    - name: Regenerate Open OnDemand portal configuration
      command: >
        /opt/ood/ood-portal-generator/sbin/update_ood_portal -f

    ############################################################################
    # PHASE 13: Apache Configuration and Service Start
    ############################################################################
    # Enable required Apache modules and start web service

    - name: Enable required Apache modules
      command: a2enmod ssl headers proxy proxy_http rewrite

    - name: Enable OOD site configuration
      command: a2ensite ood-portal.conf

    # Clean PUNs before restarting apache (prevents 46+ "left-over process" warnings
    # and ensures a clean restart without orphaned Passenger/nginx children)
    - name: Clean stale PUNs before apache restart
      shell: /opt/ood/nginx_stage/sbin/nginx_stage nginx_clean --force
      failed_when: false

    - name: Restart Apache to apply all changes
      systemd:
        name: apache2
        state: restarted

    ############################################################################
    # PHASE 14: Autofs for per-user home mounts
    ############################################################################
    - name: Ensure autofs is enabled and running
      systemd:
        name: autofs
        state: restarted
        enabled: yes
